name: Deploy to BigScoots

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — preview changes without deploying'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy via rsync
        run: |
          DRY_RUN=${{ github.event.inputs.dry_run }}
          FLAGS="-avz --delete"
          if [ "$DRY_RUN" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
            echo "⚠️  DRY RUN — no files will be changed on the server"
          fi

          rsync $FLAGS \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='*.jpg' \
            --exclude='*.jpeg' \
            --exclude='*.png' \
            --exclude='*.gif' \
            --exclude='*.webp' \
            --exclude='*.svg' \
            --exclude='*.mp4' \
            --exclude='*.mov' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/whitneyb/public_html/